[project]
name = "career-map-pipeline"
version = "0.1.0"
description = "Builds the static JSON dataset for the Career Map frontend from O*NET + BLS source data."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "umap-learn>=0.5.6,<0.6",
    "hdbscan>=0.8.38,<0.9",
    "openpyxl>=3.1,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["build_data"]
